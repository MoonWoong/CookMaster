    <script>
      // Gracefully ignore Vite WebSocket HMR disconnect errors in iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        var msg = String((reason && (reason.message || reason.stack)) || reason || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite:ws') !== -1 ||
          msg.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = String((event && (event.message || event.filename)) || event || '');
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('vite:ws') !== -1 ||
          msg.indexOf('@vite/client') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
